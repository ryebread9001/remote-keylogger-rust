[package]
name = "keylogger"
version = "0.1.0"
edition = "2021"

[dependencies]
futures-channel = "0.3.31"
futures-util = { version = "0.3.28", default-features = false, features = ["sink", "std"] }
tokio = { version = "1.0.0", default-features = false, features = ["full"] }
bson = "2.13.0"
winapi = { version = "0.3", features = ["winuser", "winnt", "processthreadsapi", "psapi", "winnls"] }
chrono = "0.4.6"
os_info = "*"
hostname = "*"
url = "2.5.4"
tungstenite = "0.26.1"
